:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --surface-2:#DDE3E8; --fg:#151D23; --muted:#56636D; --line:#C6CFD6;
  --accent:#2350C2; --accent-fg:#FFFFFF; --accent-soft:#D6E0F7; --danger:#B6352B; --ok:#1E7F55;
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101519; --surface:#192127; --surface-2:#232D35; --fg:#E5EBEE; --muted:#93A1AB; --line:#2E3A43;
  --accent:#6E93F2; --accent-fg:#0C1424; --accent-soft:#1E2B48; --danger:#F07A6E; --ok:#5BC994; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101519; --surface:#192127; --surface-2:#232D35; --fg:#E5EBEE; --muted:#93A1AB; --line:#2E3A43;
  --accent:#6E93F2; --accent-fg:#0C1424; --accent-soft:#1E2B48; --danger:#F07A6E; --ok:#5BC994; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:14px 6px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.sync{text-align:right;line-height:1.2}
.brand small{font-weight:500;color:var(--muted);letter-spacing:.06em;font-size:13px;margin-left:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--danger)}

main{padding-block:6px calc(84px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
nav.tabs button{background:none;border:0;border-radius:8px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12px;font-weight:600;letter-spacing:.01em;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);position:absolute;margin-left:18px;margin-top:-2px}

h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel.plain{background:none;border:0;padding:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.big{width:100%;min-height:64px;font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Active session */
.sbar{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:end}
.sbar .clock{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.totals{display:flex;gap:18px;flex-wrap:wrap}
.totals div{display:flex;flex-direction:column}
.totals b{font-family:var(--f-display);font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.totals span{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.grid{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:stretch}
.chip{border-radius:8px;background:var(--c);color:var(--ct);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:700;font-size:20px;min-height:58px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 14%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.chip.sm{min-height:0;height:26px;width:34px;font-size:14px;border-radius:6px;flex:none}
.cell{position:relative;display:flex}
.tap{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:8px;padding:0 14px;min-height:58px;
  border:1px solid var(--line);background:var(--surface);transition:transform .06s}
.tap:active{transform:scale(.97)}
.tap .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);text-align:left;line-height:1.15}
.tap .lbl em{font-style:normal;display:block;font-size:18px;letter-spacing:0;color:inherit;font-family:var(--f-display)}
.tap .num{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.tap.top{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tap.top .lbl{color:color-mix(in srgb,var(--accent-fg) 78%,transparent)}
.editing .tap{padding-left:46px}
.minus{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:20px;line-height:1;font-weight:600;display:flex;align-items:center;justify-content:center}
.flash{animation:fl .35s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.confirm{display:flex;flex-direction:column;gap:10px;border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}

.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px}
.note.warn{border-left-color:var(--danger);color:var(--fg)}
.note.info{border-left-color:var(--accent)}

/* Start screen */
.hero{display:flex;flex-direction:column;gap:12px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hero h2{font-size:26px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* Grade strip: tops per grade as small numbered cells */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.strip span{height:22px;border-radius:4px;background:var(--surface-2);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;color:var(--muted);position:relative;overflow:hidden}
.strip span.has{background:var(--c);color:var(--ct);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 14%,transparent)}

/* History */
.month{font-family:var(--f-display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 2px 0}
.hitem{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hitem .h1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hitem .h1 b{font-weight:600}
.hitem .h1 span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Edit form */
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;min-width:0}
input[type=date],input[type=time],input[type=number],input[type=text]{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.egrid .grow{grid-template-columns:44px 1fr 1fr}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:50px;overflow:hidden}
.stepper.top{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.stepper button{border:0;background:var(--surface-2);height:100%;font-size:20px;font-weight:600}
.stepper div{text-align:center;line-height:1.1}
.stepper b{font-family:var(--f-display);font-size:24px;display:block;font-variant-numeric:tabular-nums}
.stepper small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.colhead{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Stats */
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 15%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi.wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.kpi.wide > span{font-family:var(--f-display);font-size:20px;letter-spacing:.05em;color:var(--fg)}
.kv-r{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.kpi.wide .kv-r b{font-size:34px}
.cpanel{padding:0}
.cpanel summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
.cpanel summary::-webkit-details-marker{display:none}
.cpanel summary .sp{flex:1}
.cpanel .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.cpanel:not([open]) .chev{transform:rotate(-90deg)}
.cpanel > .chart{padding:0 14px 14px}
.cpanel .chart > .qrow + .qrow{margin-top:2px}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.chart{display:flex;flex-direction:column;gap:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart svg .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 18%,transparent)}
.qrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.qbar{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.qbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.qrow .v{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:right}
.qrow .v b{color:var(--fg);font-weight:600}
.boardt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;line-height:1.3}
.boardt .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.boardt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.boardt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.boardt[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.btag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 8px}
.tag{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:0 6px}
.demo{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.demo b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;background:var(--accent);color:var(--accent-fg);border-radius:4px;padding:1px 6px;flex:none}

/* Settings */
.srow{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px}
.toggle{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}

.loading{padding:40px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;z-index:8;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.tap,.flash{transition:none;animation:none}}
@media (max-width:360px){.tap{padding:0 10px}.tap .num{font-size:26px}.grow{grid-template-columns:46px 1fr 1fr}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">Boulder-Logbuch</div>
</div></header>

<main><div class="wrap" id="view"><div class="loading">Sessions werden geladen …</div></div></main>

<nav class="tabs" aria-label="Bereiche"><div class="wrap">
  <button data-nav="session" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/><circle cx="12" cy="14" r="3"/></svg>Session</button>
  <button data-nav="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Verlauf</button>
  <button data-nav="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
  <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Einstellungen</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="backup-file" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";
const N = 7;
const DEFAULT_GRADES = [
  {name:"1", color:"#F3C623"}, {name:"2", color:"#3FA95E"}, {name:"3", color:"#2F80D9"},
  {name:"4", color:"#F07D22"}, {name:"5", color:"#D63A33"}, {name:"6", color:"#8B57C8"}, {name:"7", color:"#2A2A2E"}
];
const LS_KEY = "boulderlog.v1";
const STALE_MS = 12 * 3600e3;

const state = {
  view: "session", mode: "loading", loaded: false,
  sessions: new Map(),
  settings: defaultSettings(),
  undo: [], editMode: false, confirmEnd: false,
  editId: null, editIsNew: false, confirmDelete: false,
  range: "90", justEnded: null, flash: null,
  downloads: null, sync: "loading",
  collapsed: new Set(), pendingImport: null
};
try{ const c = JSON.parse(localStorage.getItem(LS_KEY + ".collapsed") || "[]"); if(Array.isArray(c)) state.collapsed = new Set(c); }catch(e){}
document.addEventListener("toggle", e => {
  const d = e.target; if(!d || !d.dataset || !d.dataset.chart) return;
  if(d.open) state.collapsed.delete(d.dataset.chart); else state.collapsed.add(d.dataset.chart);
  try{ localStorage.setItem(LS_KEY + ".collapsed", JSON.stringify([...state.collapsed])); }catch(err){}
}, true);

function defaultSettings(){ return {type:"settings", grades: DEFAULT_GRADES.map(g=>({...g})), topCountsAsAttempt:true, wake:true}; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum = a => a.reduce((x,y)=>x+y,0);
const pad = n => String(n).padStart(2,"0");
const zeros = () => Array(N).fill(0);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const pct = (t,a) => a>0 ? Math.round(t/a*100) : null;
function fmtDate(ms, opts){ return new Date(ms).toLocaleDateString("de-DE", opts || {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"}); }
function fmtShort(ms){ return new Date(ms).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}); }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function fmtDur(ms){ const m = Math.max(0, Math.round(ms/60000)); return m < 60 ? m + " min" : Math.floor(m/60) + " h " + pad(m%60) + " min"; }
function fmtClock(ms){ const m = Math.max(0, Math.floor(ms/60000)); return Math.floor(m/60) + ":" + pad(m%60) + " h"; }
function newId(ts){ const d = new Date(ts); return "s-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + "-" + Math.random().toString(36).slice(2,7); }
function hexLum(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return .5;
  const v = parseInt(m[1],16); const ch = [v>>16&255, v>>8&255, v&255].map(c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);});
  return .2126*ch[0]+.7152*ch[1]+.0722*ch[2];
}
function textOn(hex){ return hexLum(hex) > .36 ? "#151D23" : "#FFFFFF"; }
function gvars(i){ const g = state.settings.grades[i] || DEFAULT_GRADES[i]; return `--c:${esc(g.color)};--ct:${textOn(g.color)}`; }
function gname(i){ return (state.settings.grades[i] && state.settings.grades[i].name) || String(i+1); }
function normSession(o){
  const fix = a => Array.from({length:N}, (_,i) => Math.max(0, Math.round(Number((a||[])[i])||0)));
  const start = Number(o.start)||Date.now();
  return {type:"session", start, last: Number(o.last)||start, end: o.end==null ? null : Number(o.end), a: fix(o.a), t: fix(o.t), board: o.board === true};
}
function normSettings(o){
  const s = defaultSettings();
  if(o && Array.isArray(o.grades)) s.grades = s.grades.map((g,i)=>{ const x = o.grades[i]||{}; return {name: String(x.name||g.name).slice(0,12), color: /^#[0-9a-f]{6}$/i.test(x.color||"") ? x.color : g.color}; });
  if(o && typeof o.topCountsAsAttempt === "boolean") s.topCountsAsAttempt = o.topCountsAsAttempt;
  if(o && typeof o.wake === "boolean") s.wake = o.wake;
  return s;
}
function sortedSessions(){ return [...state.sessions.entries()].map(([id,s])=>({id,...s})).sort((a,b)=>a.start-b.start); }
function activeSession(){
  for(const [id,s] of state.sessions) if(s.end == null) return {id, s};
  return null;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{t.hidden = true;}, 2600); }
function setSync(kind, text){
  state.sync = kind; const el = $("#sync"); if(!el) return;
  el.className = "sync " + (kind==="ok"?"ok":kind==="error"?"err":"");
  el.querySelector("span").textContent = text;
}

/* ---------- storage ---------- */
let col = null;
const ver = new Map(), timers = new Map(), chains = new Map();

function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({settings: state.settings, sessions: Object.fromEntries(state.sessions)})); }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY); if(!raw) return;
    const o = JSON.parse(raw);
    state.settings = normSettings(o.settings);
    for(const [id,s] of Object.entries(o.sessions||{})) state.sessions.set(id, normSession(s));
  }catch(e){}
}
function changed(id, delay){
  ver.set(id, (ver.get(id)||0) + 1);
  if(state.mode !== "db"){ saveLocal(); ver.delete(id); return; }
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(()=>{ timers.delete(id); queueWrite(id); }, delay==null ? 450 : delay));
  setSync("saving", "Speichert …");
}
function queueWrite(id){
  const prev = chains.get(id) || Promise.resolve();
  const p = prev.then(()=>writeDoc(id)).catch(()=>{});
  chains.set(id, p);
}
async function writeDoc(id, retried){
  const v = ver.get(id) || 0;
  const data = id === "settings" ? state.settings : state.sessions.get(id);
  try{
    const ref = col.doc(id);
    if(!data) await ref.delete(); else await ref.set(JSON.parse(JSON.stringify(data)));
    if(ver.get(id) === v && !timers.has(id)) ver.delete(id);
    if(ver.size === 0) setSync("ok", "Gespeichert");
  }catch(e){
    if(e && e.code === "unavailable" && !retried){ await sleep(700 + Math.random()*900); return writeDoc(id, true); }
    setSync("error", "Nicht gespeichert");
    if(e && e.code === "quota_exceeded") toast("Speicher voll. Alte Sessions im Verlauf löschen schafft Platz.");
    else toast("Speichern hat nicht geklappt. Bei bestehender Verbindung wird es beim nächsten Eintrag erneut versucht.");
  }
}
function flushAll(){
  for(const [id,t] of timers){ clearTimeout(t); timers.delete(id); queueWrite(id); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushAll(); else requestWake(); });

function applySnapshot(snap){
  const seen = new Set();
  for(const d of snap.docs){
    const id = d.id, data = d.data(); seen.add(id);
    if(ver.has(id) || !data) continue;
    if(id === "settings") state.settings = normSettings(data);
    else if(data.type === "session") state.sessions.set(id, normSession(data));
  }
  for(const id of [...state.sessions.keys()]) if(!seen.has(id) && !ver.has(id)) state.sessions.delete(id);
}

function initStore(){
  state.mode = "local"; loadLocal(); state.loaded = true;
  render();
  return Promise.resolve();
}
/* Ask the browser to keep the data even when storage runs low (granted silently for installed apps). */
function requestPersist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }

/* ---------- wake lock ---------- */
let wakeLock = null;
async function requestWake(){
  if(!state.settings.wake || !activeSession() || document.hidden) return releaseWake();
  if(wakeLock || !navigator.wakeLock) return;
  try{ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); }catch(e){ wakeLock = null; }
}
function releaseWake(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; } }

/* ---------- actions ---------- */
function startSession(){
  if(activeSession()) return;
  const now = Date.now(), id = newId(now);
  state.sessions.set(id, {type:"session", start:now, last:now, end:null, a:zeros(), t:zeros(), board:false});
  state.undo = []; state.editMode = false; state.confirmEnd = false; state.justEnded = null;
  changed(id, 0); requestWake(); requestPersist(); render();
}
function tap(kind, g){
  const act = activeSession(); if(!act) return;
  const s = act.s, both = kind === "t" && state.settings.topCountsAsAttempt;
  if(kind === "t"){ s.t[g]++; if(both) s.a[g]++; } else s.a[g]++;
  s.last = Date.now();
  state.undo.push({id: act.id, kind, g, both});
  if(state.undo.length > 60) state.undo.shift();
  state.flash = kind + g;
  try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
  changed(act.id); render();
}
function undo(){
  const u = state.undo.pop(); if(!u) return;
  const s = state.sessions.get(u.id); if(!s) return render();
  if(u.kind === "t"){ s.t[u.g] = Math.max(0, s.t[u.g]-1); if(u.both) s.a[u.g] = Math.max(0, s.a[u.g]-1); }
  else s.a[u.g] = Math.max(0, s.a[u.g]-1);
  changed(u.id); toast("Rückgängig: " + (u.kind==="t"?"Top":"Versuch") + " in Schwierigkeitsgrad " + gname(u.g)); render();
}
function adjust(id, kind, g, d){
  const s = state.sessions.get(id); if(!s) return;
  const arr = kind === "t" ? s.t : s.a;
  arr[g] = Math.max(0, arr[g] + d);
  changed(id); render();
}
function endSession(){
  const act = activeSession(); if(!act) return;
  const s = act.s;
  if(sum(s.a) === 0 && sum(s.t) === 0){ state.sessions.delete(act.id); changed(act.id, 0); state.justEnded = null; }
  else { s.end = Date.now(); changed(act.id, 0); state.justEnded = act.id; }
  state.undo = []; state.confirmEnd = false; state.editMode = false;
  releaseWake(); render();
}
function closeStale(id){
  const s = state.sessions.get(id); if(!s) return;
  s.end = Math.max(s.last, s.start + 60e3); changed(id, 0); state.undo = []; releaseWake(); render();
}
function backfill(){
  const d = new Date(); d.setHours(18,0,0,0);
  if(d.getTime() > Date.now()) d.setDate(d.getDate()-1);
  const start = d.getTime(), id = newId(start);
  state.sessions.set(id, {type:"session", start, last:start, end:start + 90*60e3, a:zeros(), t:zeros(), board:false});
  changed(id, 0);
  state.editId = id; state.editIsNew = true; state.confirmDelete = false; state.view = "edit"; render(); window.scrollTo(0,0);
}
function openEdit(id){ state.editId = id; state.editIsNew = false; state.confirmDelete = false; state.view = "edit"; render(); window.scrollTo(0,0); }
function closeEdit(){
  const s = state.sessions.get(state.editId);
  if(s && state.editIsNew && sum(s.a) === 0 && sum(s.t) === 0){ state.sessions.delete(state.editId); changed(state.editId, 0); }
  state.editId = null; state.view = "history"; render();
}
function deleteSession(id){
  state.sessions.delete(id); changed(id, 0);
  state.undo = state.undo.filter(u => u.id !== id);
  if(state.justEnded === id) state.justEnded = null;
  state.editId = null; state.view = "history"; toast("Session gelöscht"); render();
}
function setEditTime(field, value){
  const s = state.sessions.get(state.editId); if(!s || !value) return;
  const dur = (s.end || s.last) - s.start;
  const d = new Date(s.start);
  if(field === "date"){ const [y,m,dd] = value.split("-").map(Number); d.setFullYear(y, m-1, dd); }
  if(field === "time"){ const [h,mi] = value.split(":").map(Number); d.setHours(h, mi, 0, 0); }
  s.start = d.getTime(); s.last = s.start;
  if(s.end != null) s.end = s.start + Math.max(0, dur);
  if(field === "dur"){ const m = Math.max(1, Math.min(600, Number(value)||0)); if(s.end != null) s.end = s.start + m*60e3; }
  changed(state.editId, 600);
}
function stamp(){ const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function saveFile(name, text, type){
  try{
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ toast("Die Datei konnte nicht gespeichert werden."); return false; }
}
function exportCsv(){
  const head = ["datum","start","ende","dauer_min"];
  for(let i=0;i<N;i++) head.push("versuche_grad_"+gname(i), "tops_grad_"+gname(i));
  head.push("versuche_gesamt","tops_gesamt","board_session");
  const rows = sortedSessions().map(s => {
    const end = s.end || s.last, d = new Date(s.start);
    const r = [d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()), fmtTime(s.start), fmtTime(end), Math.round((end-s.start)/60000)];
    for(let i=0;i<N;i++) r.push(s.a[i], s.t[i]);
    r.push(sum(s.a), sum(s.t), s.board ? "ja" : "nein"); return r.join(";");
  });
  if(saveFile("boulder-logbuch-" + stamp() + ".csv", "﻿" + head.join(";") + "\n" + rows.join("\n") + "\n", "text/csv")) toast("CSV gespeichert (Ordner Downloads)");
}

/* Backup format, shared with the Claude version of the logbook */
function backupJson(){
  return JSON.stringify({app:"boulder-logbuch", format:1, exportedAt: new Date().toISOString(), settings: state.settings, sessions: Object.fromEntries(state.sessions)}, null, 1);
}
function lastBackup(){ try{ return Number(localStorage.getItem(LS_KEY + ".lastBackup")) || 0; }catch(e){ return 0; } }
function saveBackup(){
  if(saveFile("boulder-backup-" + stamp() + ".json", backupJson(), "application/json")){
    try{ localStorage.setItem(LS_KEY + ".lastBackup", String(Date.now())); }catch(e){}
    toast("Backup gespeichert (Ordner Downloads)"); render();
  }
}
function readBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let o;
    try{ o = JSON.parse(r.result); }catch(e){ o = null; }
    if(!o || o.app !== "boulder-logbuch" || typeof o.sessions !== "object"){
      state.pendingImport = {error: "Die Datei ist kein Backup des Boulder-Logbuchs."}; render(); return;
    }
    const sessions = {};
    for(const [id, s] of Object.entries(o.sessions || {})) if(/^[\w.~:@+-]{1,80}$/.test(id) && s && typeof s === "object") sessions[id] = normSession(s);
    const ids = Object.keys(sessions);
    state.pendingImport = {sessions, settings: o.settings ? normSettings(o.settings) : null, count: ids.length,
      fresh: ids.filter(id => !state.sessions.has(id)).length, when: Date.parse(o.exportedAt) || null};
    render();
  };
  r.onerror = () => { state.pendingImport = {error: "Die Datei konnte nicht gelesen werden."}; render(); };
  r.readAsText(file);
}
function applyImport(){
  const p = state.pendingImport; if(!p || p.error) return;
  for(const [id, s] of Object.entries(p.sessions)) state.sessions.set(id, s);
  if(p.settings) state.settings = p.settings;
  state.pendingImport = null; saveLocal();
  toast(p.count + " Sessions aus dem Backup übernommen"); render();
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => {
    const v = state.view === "edit" ? "history" : state.view;
    if(b.dataset.nav === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const el = $("#view");
  if(!state.loaded){ el.innerHTML = `<div class="loading">Sessions werden geladen …</div>`; return; }
  const fn = {session: viewSession, history: viewHistory, stats: viewStats, settings: viewSettings, edit: viewEdit}[state.view] || viewSession;
  el.innerHTML = fn();
  if(state.flash){ const b = el.querySelector(`[data-flash="${state.flash}"]`); if(b) b.classList.add("flash"); state.flash = null; }
}

function totalsHtml(s){
  const a = sum(s.a), t = sum(s.t);
  let hard = -1; s.t.forEach((v,i)=>{ if(v) hard = i; });
  return `<div class="totals"><div><b>${a}</b><span>Versuche</span></div><div><b>${t}</b><span>Tops</span></div><div><b>${hard<0?"–":esc(gname(hard))}</b><span>Schwerster Top</span></div></div>`;
}
function stripHtml(s){
  return `<div class="strip" aria-label="Tops pro Schwierigkeitsgrad">${s.t.map((v,i)=>`<span class="${v?"has":""}" style="${gvars(i)}" title="Schwierigkeitsgrad ${esc(gname(i))}: ${v} Tops, ${s.a[i]} Versuche">${v||"·"}</span>`).join("")}</div>`;
}

function viewSession(){
  const act = activeSession();
  if(act && Date.now() - act.s.last > STALE_MS){
    const s = act.s;
    return `<div class="stack">
      <div class="panel confirm"><h2>Session vom ${esc(fmtDate(s.start))} ist noch offen</h2>
        <p class="muted">Letzter Eintrag um ${fmtTime(s.last)}. Erst nach dem Abschließen lässt sich eine neue starten.</p>
        ${totalsHtml(s)}
        <div class="row-actions"><button class="btn primary" data-act="close-stale" data-id="${act.id}">Abschließen</button>
        <button class="btn" data-act="resume" data-id="${act.id}">Weiterführen</button></div></div></div>`;
  }
  if(act) return viewActive(act);
  return viewStart();
}

function viewActive(act){
  const s = act.s, ed = state.editMode;
  const rows = s.a.map((_,i)=>`
    <div class="grow">
      <div class="chip" style="${gvars(i)}">${esc(gname(i))}</div>
      <div class="cell">${ed?`<button class="minus" data-act="minus" data-k="a" data-g="${i}" aria-label="Versuch abziehen">−</button>`:""}
        <button class="tap" data-act="tap" data-k="a" data-g="${i}" data-flash="a${i}" aria-label="Versuch in Schwierigkeitsgrad ${esc(gname(i))}"><span class="lbl">Versuch<em>+1</em></span><span class="num">${s.a[i]}</span></button></div>
      <div class="cell">${ed?`<button class="minus" data-act="minus" data-k="t" data-g="${i}" aria-label="Top abziehen">−</button>`:""}
        <button class="tap top" data-act="tap" data-k="t" data-g="${i}" data-flash="t${i}" aria-label="Top in Schwierigkeitsgrad ${esc(gname(i))}"><span class="lbl">Top<em>+1</em></span><span class="num">${s.t[i]}</span></button></div>
    </div>`).join("");
  const last = state.undo[state.undo.length-1];
  return `<div class="stack">
    <div class="sbar"><div class="stack" style="gap:8px">
      <div class="clock">Session läuft · <span id="clock">${fmtClock(Date.now()-s.start)}</span> · seit ${fmtTime(s.start)}</div>
      ${totalsHtml(s)}</div></div>
    ${state.confirmEnd ? `<div class="panel confirm"><p><b>Session beenden?</b> ${sum(s.a)} Versuche und ${sum(s.t)} Tops werden gespeichert.</p>
      <div class="row-actions"><button class="btn primary" data-act="end">Ja, beenden</button><button class="btn" data-act="end-cancel">Weiterklettern</button></div></div>` : ""}
    <div class="grid ${ed?"editing":""}">${rows}</div>
    ${boardToggle(s)}
    <div class="toolbar">
      <button class="btn" data-act="undo" ${last?"":"disabled"}>↶ Rückgängig${last?` <span class="muted small">(${last.kind==="t"?"Top":"Versuch"} ${esc(gname(last.g))})</span>`:""}</button>
      <button class="btn ${ed?"primary":""}" data-act="toggle-edit">${ed?"Fertig":"Korrigieren"}</button>
      <span class="sp"></span>
      ${state.confirmEnd ? "" : `<button class="btn danger" data-act="end-ask">Beenden</button>`}
    </div>
    <p class="note">${state.settings.topCountsAsAttempt ? "Ein Top zählt automatisch auch als Versuch. „Versuch“ also nur für Versuche ohne Top tippen." : "Tops und Versuche werden getrennt gezählt. Bei einem geschafften Boulder beides tippen."} Änderbar unter Einstellungen.</p>
  </div>`;
}

function viewStart(){
  const list = sortedSessions().filter(s => s.end != null);
  const ended = state.justEnded && state.sessions.get(state.justEnded);
  let lastHtml = "";
  if(ended){
    const s = ended;
    lastHtml = `<div class="panel stack" style="gap:10px"><h3>Gerade beendet · ${fmtDur((s.end||s.last)-s.start)}</h3>${totalsHtml(s)}${stripHtml(s)}
      ${compareHtml(s, list.filter(x=>x.start < s.start))}</div>`;
  } else if(list.length){
    const s = list[list.length-1];
    lastHtml = `<div class="panel stack" style="gap:10px"><h3>Letzte Session · ${esc(fmtDate(s.start,{weekday:"long",day:"numeric",month:"long"}))}</h3>${totalsHtml(s)}${stripHtml(s)}</div>`;
  }
  const n30 = list.filter(s => s.start > Date.now() - 30*864e5).length;
  return `<div class="stack">
    <div class="hero">
      <h2>${list.length ? "Neue Session" : "Erste Session"}</h2>
      <p class="muted">Pro Schwierigkeitsgrad „Versuch“ oder „Top“ tippen, mehr nicht. Die Zahlen landen automatisch im Verlauf und in der Statistik.</p>
      <button class="btn primary big" data-act="start">Session starten</button>
      <div class="row-actions"><button class="btn ghost" data-act="backfill">Vergangene Session nachtragen</button></div>
    </div>
    ${lastHtml}
    ${list.length ? `<div class="kv panel"><div><b>${list.length}</b><span>Sessions</span></div><div><b>${n30}</b><span>letzte 30 Tage</span></div><div><b>${sum(list.map(s=>sum(s.t)))}</b><span>Tops gesamt</span></div></div>` : ""}
    ${list.length >= 3 && Date.now() - lastBackup() > 30*864e5 ? `<div class="note info toolbar"><span style="flex:1;min-width:0">${lastBackup() ? "Letztes Backup vor über einem Monat." : "Noch kein Backup gespeichert."} Die Daten liegen nur auf diesem Gerät.</span><button class="btn" data-act="backup">Backup speichern</button></div>` : ""}
  </div>`;
}

function boardToggle(s){
  const id = state.view === "edit" ? state.editId : (activeSession()||{}).id;
  return `<button class="boardt" data-act="board" data-id="${esc(id)}" aria-pressed="${!!s.board}"><span class="box" aria-hidden="true"></span><span><b>+ Board-Session</b><br><span class="small muted">Zusätzlich am Kilter- oder Moonboard trainiert</span></span></button>`;
}
function compareHtml(s, prev){
  const recent = prev.slice(-5); if(recent.length < 2) return "";
  const avgA = sum(recent.map(x=>sum(x.a)))/recent.length, avgT = sum(recent.map(x=>sum(x.t)))/recent.length;
  const d = (v, avg) => { const p = avg ? Math.round((v-avg)/avg*100) : 0; return (p>0?"+":"") + p + " %"; };
  return `<p class="small muted">Im Vergleich zum Schnitt der letzten ${recent.length} Sessions: Versuche ${d(sum(s.a),avgA)}, Tops ${d(sum(s.t),avgT)}.</p>`;
}

function viewHistory(){
  const list = sortedSessions().filter(s => s.end != null).reverse();
  if(!list.length) return `<div class="stack"><h2>Verlauf</h2>
    <div class="panel stack" style="gap:10px"><p>Hier erscheinen die Sessions, sobald die erste beendet ist. Jede Session lässt sich nachträglich öffnen und korrigieren.</p>
    <div class="row-actions"><button class="btn primary" data-nav="session">Zur Session</button><button class="btn" data-act="backfill">Nachtragen</button></div></div></div>`;
  let html = `<div class="stack"><div class="toolbar"><h2>Verlauf</h2><span class="sp"></span><button class="btn" data-act="backfill">+ Nachtragen</button></div>`;
  let month = "";
  for(const s of list){
    const m = new Date(s.start).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    if(m !== month){ month = m; html += `<div class="month">${esc(m)}</div>`; }
    html += `<button class="hitem" data-act="open" data-id="${esc(s.id)}">

      <span>${fmtDur((s.end||s.last)-s.start)} · ${sum(s.a)} Versuche · ${sum(s.t)} Tops</span></div>${stripHtml(s)}${s.board?`<span class="btag">+ Board-Session</span>`:""}</button>`;
  }
  return html + `</div>`;
}

function viewEdit(){
  const s = state.sessions.get(state.editId);

    <div class="fields">

    ${state.confirmDelete ? `<div class="panel confirm"><p><b>Diese Session endgültig löschen?</b> ${sum(s.a)} Versuche und ${sum(s.t)} Tops gehen verloren.</p>

  </div>`;

/* ---------- stats ---------- */
function demoSessions(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const out = [], now = Date.now();
  for(let k=0;k<20;k++){
    const start = now - (84 - k*4.2) * 864e5 - rnd()*3600e3;
    const lvl = 1.6 + k*0.07;
    const a = zeros(), t = zeros();
    for(let g=0; g<N; g++){
      const dist = g - lvl;
      const att = Math.max(0, Math.round((dist < -1 ? 4 : dist < 1.5 ? 9 - Math.abs(dist)*2 : 3 - dist) + rnd()*3 - 1));
      const rate = Math.max(0, Math.min(1, 0.85 - (dist+1)*0.28));
      a[g] = att; t[g] = Math.min(att, Math.round(att*rate*(0.7+rnd()*0.5)));
    }
    out.push({id:"demo"+k, start, end:start + (75+rnd()*50)*60e3, last:start, a, t});
  }
  return out;
}
function weekStart(ms){ const d = new Date(ms); d.setHours(0,0,0,0); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function monthStart(ms){ const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
function bucketize(list, unit){
  const map = new Map();
  for(const s of list){
    const k = unit === "month" ? monthStart(s.start) : weekStart(s.start);
    if(!map.has(k)) map.set(k, {start:k, a:zeros(), t:zeros(), n:0});
    const b = map.get(k); b.n++; for(let i=0;i<N;i++){ b.a[i]+=s.a[i]; b.t[i]+=s.t[i]; }
  }
  return [...map.values()].sort((x,y)=>x.start-y.start);
}
function niceMax(v){ if(v<=4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,2,3,4,5,6,8,10]) if(m*p >= v) return m*p; return 10*p; }

/* One stacked bar, grade 1 nearest the baseline. Each grade is drawn as one rect from the baseline
   to its cumulative end, outermost first, so neighbouring segments share an edge with no seams or outlines. */
function stackRects(x, base, w, vals, k, dir, tip){
  const ends = []; let cum = 0;
  vals.forEach((v,i)=>{ cum += v; ends[i] = cum; });
  let out = "";
  for(let i=N-1;i>=0;i--){
    if(!vals[i]) continue;
    const ext = ends[i]*k, y = dir < 0 ? base - ext : base;
    out += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${ext.toFixed(2)}" fill="${chartColor(i)}" stroke="var(--surface)" stroke-width="1"><title>${tip(i)}</title></rect>`;
  }
  return out;
}
function gridLine(L, R, W, y, label){ return `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>` + (label==null ? "" : `<text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${label}</text>`); }

/* mode "a": attempts · "t": tops — stacked by grade */
function chartStacked(points, perLabel, mode){
  const W=360, H=200, L=30, R=6, T=10, B=26, pw=W-L-R, ph=H-T-B, base=T+ph;
  const key = mode === "t" ? "t" : "a", word = mode === "t" ? "Tops" : "Versuche";
  const n = points.length, max = niceMax(Math.max(1, ...points.map(p=>sum(p[key]))));
  const step = pw / n, bw = Math.min(22, step*0.72), k = ph/max;
  let g = "";
  for(const f of [0, .5, 1]) g += gridLine(L, R, W, base - f*ph, Math.round(max*f));
  points.forEach((p,j)=>{
    g += stackRects(L + step*j + (step-bw)/2, base, bw, p[key], k, -1, i => `${perLabel(p)} · Schwierigkeitsgrad ${esc(gname(i))}: ${p[key][i]} ${word}`);
  });
  g += xLabels(points, L, step, H-8, perLabel);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${word} pro Zeitraum, gestapelt nach Schwierigkeitsgrad">${g}</svg>`;
}

/* Stacked area: the session totals per grade are joined by lines and the band between them is filled.
   Drawn like the bars: each grade's area reaches from the baseline to its cumulative line, outermost first. */
function chartArea(points, perLabel, mode){
  if(points.length < 2) return chartStacked(points, perLabel, mode);
  const W=360, H=200, L=30, R=6, T=10, B=26, pw=W-L-R, ph=H-T-B, base=T+ph;
  const key = mode === "t" ? "t" : "a", word = mode === "t" ? "Tops" : "Versuche";
  const n = points.length, max = niceMax(Math.max(1, ...points.map(p=>sum(p[key]))));
  const step = pw / n, k = ph/max, xs = points.map((_,j)=>L + step*j + step/2);
  let g = "";
  for(const f of [0, .5, 1]) g += gridLine(L, R, W, base - f*ph, Math.round(max*f));
  for(let i=N-1;i>=0;i--){
    const cum = points.map(p => sum(p[key].slice(0, i+1)));
    if(points.every(p => !p[key][i])) continue;
    const line = xs.map((x,j)=>`${x.toFixed(2)},${(base - cum[j]*k).toFixed(2)}`).join(" L");
    const tot = sum(points.map(p=>p[key][i]));
    g += `<path d="M${xs[0].toFixed(2)},${base} L${line} L${xs[n-1].toFixed(2)},${base} Z" fill="${chartColor(i)}" stroke="var(--surface)" stroke-width="1.2" stroke-linejoin="round"><title>Schwierigkeitsgrad ${esc(gname(i))}: ${tot} ${word} im Zeitraum</title></path>`;
  }
  const top = xs.map((x,j)=>`${x.toFixed(2)},${(base - sum(points[j][key])*k).toFixed(2)}`).join(" ");
  g += `<polyline points="${top}" fill="none" stroke="var(--fg)" stroke-opacity=".55" stroke-width="1" stroke-linejoin="round"/>`;
  g += xLabels(points, L, step, H-8, perLabel);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${word} pro Zeitraum als gestapelte Fläche nach Schwierigkeitsgrad">${g}</svg>`;
}

/* Variant: attempts grow upward, tops downward from a shared zero line, same scale */
function chartMirror(points, perLabel){
  const W=360, H=250, L=30, R=6, T=10, B=26, pw=W-L-R, ph=H-T-B;
  const maxA = niceMax(Math.max(1, ...points.map(p=>sum(p.a)))), maxT = niceMax(Math.max(1, ...points.map(p=>sum(p.t))));
  const k = ph/(maxA+maxT), y0 = T + maxA*k;
  const n = points.length, step = pw / n, bw = Math.min(22, step*0.72);
  let tops = "";
  let g = gridLine(L, R, W, T, maxA) + gridLine(L, R, W, T + maxA*k/2, Math.round(maxA/2))
        + gridLine(L, R, W, y0 + maxT*k/2, Math.round(maxT/2)) + gridLine(L, R, W, T+ph, maxT);
  points.forEach((p,j)=>{
    const x = L + step*j + (step-bw)/2;
    g += stackRects(x, y0, bw, p.a, k, -1, i => `${perLabel(p)} · Schwierigkeitsgrad ${esc(gname(i))}: ${p.a[i]} Versuche`);
    tops += stackRects(x, y0, bw, p.t, k, 1, i => `${perLabel(p)} · Schwierigkeitsgrad ${esc(gname(i))}: ${p.t[i]} Tops`);
  });
  g += `<g opacity=".5">${tops}</g>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--fg)" stroke-width="1.2"/><text x="${L-6}" y="${(y0+3.5).toFixed(1)}" text-anchor="end">0</text>`;
  g += xLabels(points, L, step, H-8, perLabel);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Versuche nach oben, Tops nach unten, pro Zeitraum">${g}</svg>`;
}
function xLabels(points, L, step, y, perLabel){
  const n = points.length; if(!n) return "";
  const idx = n <= 3 ? points.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  return idx.map((j,k)=>`<text x="${(L + step*j + step/2).toFixed(1)}" y="${y}" text-anchor="${n>3 && k===0 ? "start" : n>3 && k===2 ? "end" : "middle"}">${perLabel(points[j])}</text>`).join("");
}
function chartLevel(points, perLabel){
  const W=360, H=200, L=30, R=8, T=12, B=26, pw=W-L-R, ph=H-T-B;
  const n = points.length, step = pw / n;
  const y = gi => T + ph - (gi/(N-1))*ph;
  let g = "";
  for(let i=0;i<N;i++){ g += `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(i)}" y2="${y(i)}" ${i%2?'stroke-dasharray="2 3"':''}/><text x="${L-6}" y="${y(i)+3.5}" text-anchor="end">${esc(gname(i)).slice(0,4)}</text>`; }
  const avg = [], mx = [];
  points.forEach((p,j)=>{
    const tt = sum(p.t); if(!tt) return;
    const x = L + step*j + step/2;
    avg.push([x, y(p.t.reduce((acc,v,i)=>acc+v*i,0)/tt), p]);
    let m = -1; p.t.forEach((v,i)=>{ if(v) m = i; }); mx.push([x, y(m), m, p]);
  });
  if(avg.length > 1) g += `<polyline points="${avg.map(a=>a[0].toFixed(1)+","+a[1].toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  mx.forEach(m => { g += `<rect x="${(m[0]-3.5).toFixed(1)}" y="${(m[1]-3.5).toFixed(1)}" width="7" height="7" fill="none" stroke="var(--fg)" stroke-width="1.3"><title>${perLabel(m[3])} · schwerster Top: Schwierigkeitsgrad ${esc(gname(m[2]))}</title></rect>`; });
  avg.forEach((a,k) => { const last = k === avg.length-1; g += `<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${last?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>${perLabel(a[2])} · Ø Schwierigkeitsgrad der Tops</title></circle>`; });
  g += xLabels(points, L, step, H-8, perLabel);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Durchschnittlicher und schwerster getoppter Schwierigkeitsgrad">${g}</svg>`;
}

function viewStats(){
  const real = sortedSessions().filter(s => s.end != null);
  const demo = real.length === 0;
  const all = demo ? demoSessions() : real;
  const days = state.range === "all" ? Infinity : Number(state.range);
  const list = all.filter(s => days === Infinity || s.start >= Date.now() - days*864e5);
  const ranges = [["30","30 Tage"],["90","90 Tage"],["365","1 Jahr"],["all","Gesamt"]];
  let html = `<div class="stack">
    <div class="toolbar"><h2>Statistik</h2><span class="sp"></span>
      <div class="seg" role="group" aria-label="Zeitraum">${ranges.map(([k,l])=>`<button data-act="range" data-r="${k}" aria-pressed="${state.range===k}">${l}</button>`).join("")}</div></div>
    ${demo ? `<div class="demo"><b>Beispiel</b><span>Das sind erfundene Beispieldaten, die zeigen, wie die Auswertung aussieht. Nach der ersten beendeten Session stehen hier die eigenen Zahlen.</span></div>` : ""}`;
  if(!list.length) return html + `<div class="panel"><p class="muted">In diesem Zeitraum gibt es keine Sessions. Ein längerer Zeitraum zeigt mehr.</p></div></div>`;

  const A = zeros(), Tt = zeros(); let mins = 0;
  for(const s of list){ for(let i=0;i<N;i++){ A[i]+=s.a[i]; Tt[i]+=s.t[i]; } mins += ((s.end||s.last)-s.start)/60000; }
  const totA = sum(A), totT = sum(Tt), n = list.length, nb = list.filter(s => s.board).length;
  const span = Math.max(1, (Date.now() - list[0].start) / (7*864e5));
  const perWeek = days === Infinity ? n/span : n/(days/7);

  html += `<div class="kpis">
    <div class="kpi wide"><span>Sessions</span><div class="kv-r"><b>${n}</b><em>${perWeek.toFixed(1).replace(".",",")} pro Woche${nb?`<br>davon ${nb} mit Board`:""}</em></div></div>
    <div class="kpi"><span>Versuche</span><b>${totA}</b><em>Ø ${Math.round(totA/n)} pro Session</em></div>
    <div class="kpi"><span>Tops</span><b>${totT}</b><em>Ø ${(totT/n).toFixed(1).replace(".",",")} pro Session</em></div>
  </div>`;

  const perSession = list.length <= 40;
  const pts = perSession ? list : bucketize(list, "week");
  const perLabel = perSession ? (p => fmtShort(p.start)) : (p => "KW ab " + fmtShort(p.start));
  const per = perSession ? "pro Session" : "pro Woche";
  const legend = `<div class="legend">${state.settings.grades.map((g,i)=>`<span><i style="--c:${chartColor(i)}"></i>${esc(gname(i))}</span>`).join("")}</div>`;
  html += chartPanel("vers", `Versuche ${per}`, chartStacked(pts, perLabel, "a") + legend);
  html += chartPanel("tops", `Tops ${per}`, chartStacked(pts, perLabel, "t") + legend);
  html += chartPanel("vers-area", `Versuche ${per} · Fläche`, chartArea(pts, perLabel, "a") + legend, true);
  html += chartPanel("tops-area", `Tops ${per} · Fläche`, chartArea(pts, perLabel, "t") + legend, true);
  html += chartPanel("combo", `Versuche &amp; Tops ${per}`, chartMirror(pts, perLabel) + legend +
    `<p class="small muted"><b>Oben Versuche, unten Tops.</b> Versuche wachsen von der Nulllinie nach oben, Tops nach unten. Beide Seiten nutzen dieselbe Skala, Schwierigkeitsgrad 1 liegt jeweils an der Nulllinie.</p>`);
  html += chartPanel("level", `Schwierigkeit der Tops ${per}`, chartLevel(pts, perLabel) +
    `<div class="legend"><span><i style="--c:var(--accent)"></i>Ø Schwierigkeitsgrad der Tops</span><span><i style="--c:transparent;box-shadow:inset 0 0 0 1.5px var(--fg)"></i>Schwerster Top</span></div>`);
  html += chartPanel("quote", "Top-Quote je Schwierigkeitsgrad", A.map((a,i)=>{ const q = pct(Tt[i],a);
    return `<div class="qrow"><div class="chip sm" style="${gvars(i)}">${esc(gname(i))}</div><div class="qbar"><i style="width:${q||0}%"></i></div>
    <div class="v"><b>${Tt[i]}</b> / ${a} · ${q==null?"–":q+" %"}</div></div>`; }).join("") +
    `<p class="small muted">Tops / Versuche im gewählten Zeitraum. Am aussagekräftigsten ist der Vergleich über die Zeit innerhalb eines Schwierigkeitsgrads: Steigt die Quote in einem hohen Schwierigkeitsgrad, ist das ein Zeichen für Fortschritt.</p>`);
  return html + `</div>`;
}
/* Collapsible chart card; the open/closed choice is remembered per viewer in this browser. */
function chartPanel(id, title, body, test){
  const open = !state.collapsed.has(id);
  return `<details class="panel cpanel" data-chart="${id}" ${open?"open":""}>
    <summary><h3>${title}</h3>${test?`<span class="tag">Test</span>`:""}<span class="sp"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="chart">${body}</div></details>`;
}
/* Grade colours as used in charts: same hue, about 35 % less saturation. */
function chartColor(i){
  const hex = (state.settings.grades[i] || DEFAULT_GRADES[i]).color;
  const m = /^#?([0-9a-f]{6})$/i.exec(hex); if(!m) return esc(hex);
  const v = parseInt(m[1],16); let r = (v>>16&255)/255, g = (v>>8&255)/255, b = (v&255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn;
  let h = 0, s = 0;
  if(d){ s = d/(1-Math.abs(2*l-1)); h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h *= 60; if(h<0) h += 360; }
  return `hsl(${h.toFixed(0)} ${(s*65).toFixed(0)}% ${(l*100).toFixed(0)}%)`;
}

function viewSettings(){
  const s = state.settings;
  return `<div class="stack">
    <h2>Einstellungen</h2>
    <div class="panel stack" style="gap:10px">
      <h3>7 Schwierigkeitsgrade, leicht bis schwer</h3>
      <p class="small muted">Name und Farbe jedes Schwierigkeitsgrads, so wie in der Halle, z. B. „Gelb“ oder „6a“. Kurze Namen passen am besten.</p>
      ${s.grades.map((g,i)=>`<div class="srow"><div class="chip sm" style="${gvars(i)}">${i+1}</div>
        <input type="text" id="g-name-${i}" maxlength="12" value="${esc(g.name)}" data-gname="${i}" aria-label="Name für Schwierigkeitsgrad ${i+1}">
        <input type="color" id="g-color-${i}" value="${esc(g.color)}" data-gcolor="${i}" aria-label="Farbe für Schwierigkeitsgrad ${i+1}"></div>`).join("")}
    </div>
    <div class="panel stack" style="gap:14px">
      <label class="toggle" for="opt-top"><span><b>Top zählt auch als Versuch</b><br><span class="small muted">An: Für einen geschafften Boulder reicht ein Tipp auf „Top“. Aus: Versuche und Tops werden komplett getrennt gezählt.</span></span>
        <input type="checkbox" id="opt-top" data-opt="topCountsAsAttempt" ${s.topCountsAsAttempt?"checked":""}></label>
      <label class="toggle" for="opt-wake"><span><b>Bildschirm während der Session anlassen</b><br><span class="small muted">Funktioniert nicht in jedem Browser.</span></span>
        <input type="checkbox" id="opt-wake" data-opt="wake" ${s.wake?"checked":""}></label>
    </div>
    <div class="panel stack" style="gap:10px">
      <h3>Daten &amp; Backup</h3>
      <p class="small">Alle Sessions liegen nur auf diesem Gerät, im Speicher der App. Nichts wird hochgeladen. Ein Backup sichert sie als Datei im Ordner Downloads, z. B. für ein neues Handy oder falls die App-Daten gelöscht werden.</p>
      <p class="small muted">${sortedSessions().length} Sessions gespeichert · ${lastBackup() ? "letztes Backup am " + esc(fmtDate(lastBackup(), {day:"2-digit", month:"2-digit", year:"numeric"})) : "noch kein Backup"}</p>
      <div class="row-actions"><button class="btn primary" data-act="backup">Backup speichern</button><button class="btn" data-act="restore">Backup laden</button><button class="btn" data-act="export">Als CSV exportieren</button></div>
      ${state.pendingImport ? (state.pendingImport.error
        ? `<p class="note warn">${esc(state.pendingImport.error)}</p>`
        : `<div class="panel confirm"><p><b>${state.pendingImport.count} Sessions im Backup${state.pendingImport.when ? " vom " + esc(fmtDate(state.pendingImport.when, {day:"2-digit", month:"2-digit", year:"numeric"})) : ""}.</b> ${state.pendingImport.fresh} davon sind neu. Vorhandene Sessions bleiben erhalten, gleiche Sessions werden mit dem Stand aus dem Backup überschrieben. Die Schwierigkeitsgrade und Einstellungen kommen ebenfalls aus dem Backup.</p>
          <div class="row-actions"><button class="btn primary" data-act="import-yes">Übernehmen</button><button class="btn" data-act="import-no">Abbrechen</button></div></div>`) : ""}
    </div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if(nav){
    if(state.view === "edit") closeEdit();
    state.view = nav.dataset.nav; state.confirmEnd = false; render(); window.scrollTo(0,0); return;
  }
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const g = Number(b.dataset.g), act = b.dataset.act;
  switch(act){
    case "start": startSession(); break;
    case "tap": tap(b.dataset.k, g); break;
    case "minus": { const a = activeSession(); if(a) adjust(a.id, b.dataset.k, g, -1); break; }
    case "undo": undo(); break;
    case "toggle-edit": state.editMode = !state.editMode; render(); break;
    case "end-ask": state.confirmEnd = true; render(); break;
    case "end-cancel": state.confirmEnd = false; render(); break;
    case "end": endSession(); break;
    case "close-stale": closeStale(b.dataset.id); break;
    case "resume": { const s = state.sessions.get(b.dataset.id); if(s){ s.last = Date.now(); changed(b.dataset.id, 0); requestWake(); render(); } break; }
    case "backfill": backfill(); break;
    case "open": openEdit(b.dataset.id); break;
    case "close-edit": closeEdit(); window.scrollTo(0,0); break;
    case "adj": adjust(state.editId, b.dataset.k, g, Number(b.dataset.d)); break;
    case "del-ask": state.confirmDelete = true; render(); break;
    case "del-cancel": state.confirmDelete = false; render(); break;
    case "del": deleteSession(b.dataset.id); break;
    case "range": state.range = b.dataset.r; try{ localStorage.setItem(LS_KEY+".range", state.range); }catch(_){} render(); break;
    case "export": exportCsv(); break;
    case "backup": saveBackup(); break;
    case "restore": state.pendingImport = null; $("#backup-file").value = ""; $("#backup-file").click(); break;
    case "import-yes": applyImport(); break;
    case "import-no": state.pendingImport = null; render(); break;
    case "board": { const s = state.sessions.get(b.dataset.id); if(s){ s.board = !s.board; changed(b.dataset.id, 300); render(); } break; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "backup-file"){ if(t.files && t.files[0]) readBackup(t.files[0]); return; }
  if(t.dataset.field){ setEditTime(t.dataset.field, t.value); render(); return; }
  if(t.dataset.gcolor != null){ state.settings.grades[Number(t.dataset.gcolor)].color = t.value; changed("settings", 300); render(); return; }
  if(t.dataset.gname != null){ const v = t.value.trim().slice(0,12); state.settings.grades[Number(t.dataset.gname)].name = v || String(Number(t.dataset.gname)+1); changed("settings", 300); render(); return; }
  if(t.dataset.opt){ state.settings[t.dataset.opt] = t.checked; changed("settings", 200); if(t.dataset.opt === "wake") requestWake(); render(); }
});

setInterval(()=>{ const c = document.getElementById("clock"); const a = activeSession(); if(c && a) c.textContent = fmtClock(Date.now()-a.s.start); }, 20000);
try{ const r = localStorage.getItem(LS_KEY+".range"); if(r) state.range = r; }catch(e){}

initStore().then(()=>requestWake());
/* Other tabs or windows of the app stay in step */
window.addEventListener("storage", e => { if(e.key === LS_KEY){ state.sessions.clear(); loadLocal(); render(); } });
if("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
</script>
